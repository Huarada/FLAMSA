[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-fire"
version = "0.1.0"
description = "Explainable fire-safety explorer over NASA PSI microgravity combustion data"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pandas>=2.1", "numpy>=1.24,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pypdf>=4"]
evidence = ["pypdf>=4"]  # needed to verify quotes that cite a PDF page
capture = ["requests>=2.31", "beautifulsoup4>=4.12", "markdownify>=0.13"]
dashboard = ["streamlit>=1.60,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"psi_fire.interface" = ["assets/*.svg", "assets/*.jpg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
plugins = ["pydantic.mypy"]
